<title>boostplus Admin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="admin.webmanifest">

<style>
/* লে-আউট: মোবাইল-প্রথম অ্যাপ শেল — ওপরে শিরোনাম, মাঝে স্ক্রল, নিচে 5-বার; বিস্তারিত নিচ থেকে ওঠা ড্রয়ারে */
:root{
  --bg:#f4f5fa;--surface:#fff;--surface-2:#eceef6;--ink:#141929;--muted:#5b647b;--line:#e0e4ef;
  --accent:#4f46e5;--accent-2:#6d63f5;--accent-soft:#ebe9fd;--on-accent:#fff;
  --good:#0e8a5d;--good-soft:#ddf4ea;--warn:#a66a06;--warn-soft:#fbefd2;--bad:#c13b2c;--bad-soft:#fde4e0;--info:#0a74b8;--info-soft:#dff0fb;
  --shadow:0 -6px 24px rgb(20 25 41/.08);--scrim:rgb(15 18 30/.5);
  --font:'Hind Siliguri','Inter',system-ui,sans-serif;--num:'Inter','Hind Siliguri',system-ui,sans-serif;
  --nav-h:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0f1a;--surface:#131929;--surface-2:#1b2236;--ink:#e9ecf6;--muted:#9aa3bc;--line:#252e48;
  --accent:#8f8bff;--accent-2:#a5a2ff;--accent-soft:#25255b;--on-accent:#0b0f1a;
  --good:#4fd1a0;--good-soft:#11342a;--warn:#e9b24c;--warn-soft:#3b2e12;--bad:#ff8c7c;--bad-soft:#40211d;--info:#6cc0f2;--info-soft:#12303f;
  --shadow:0 -6px 24px rgb(0 0 0/.4);--scrim:rgb(0 0 0/.62);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0f1a;--surface:#131929;--surface-2:#1b2236;--ink:#e9ecf6;--muted:#9aa3bc;--line:#252e48;
  --accent:#8f8bff;--accent-2:#a5a2ff;--accent-soft:#25255b;--on-accent:#0b0f1a;
  --good:#4fd1a0;--good-soft:#11342a;--warn:#e9b24c;--warn-soft:#3b2e12;--bad:#ff8c7c;--bad-soft:#40211d;--info:#6cc0f2;--info-soft:#12303f;
  --shadow:0 -6px 24px rgb(0 0 0/.4);--scrim:rgb(0 0 0/.62);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.hdr h1{font-size:21px;font-weight:700;margin:0;flex:1;letter-spacing:-.01em}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.ib:active{transform:scale(.96)}
main{flex:1;padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;align-content:start}
.alert{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font:inherit;text-align:left}
.screen[hidden],.alert[hidden],#login[hidden],.badge[hidden]{display:none!important}
.screen{display:grid;gap:12px;align-content:start}
.demo{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:6px 10px}

/* নিচের বার */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--shadow);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{border:0;background:transparent;color:var(--muted);display:grid;justify-items:center;gap:2px;padding:6px 0 4px;border-radius:12px;font-size:12px;font-weight:600;position:relative;min-height:50px}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/18px var(--num);text-align:center;padding:0 5px}

/* সাধারণ */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:46px;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;min-width:0;height:100%}
.search input:focus-visible{outline:none}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 12px;display:flex;align-items:baseline;gap:7px;font-weight:600;color:var(--muted);font-size:14px}
.chip b{font:700 15px var(--num);color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip[aria-pressed="true"] b{color:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.btn{border:0;border-radius:12px;height:44px;padding:0 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--on-accent)}
.btn.sec{background:var(--surface-2);color:var(--ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-weight:700;font-size:12px;white-space:nowrap}
.s-pen{background:var(--warn-soft);color:var(--warn)}.s-pro{background:var(--info-soft);color:var(--info)}.s-par{background:var(--accent-soft);color:var(--accent)}.s-ok{background:var(--good-soft);color:var(--good)}.s-rej{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.t{font-weight:700}.sm{font-size:13px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{display:grid;gap:10px}
#svList{padding-bottom:72px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:16px}
.empty b{display:block;color:var(--ink);margin-bottom:2px}

/* অর্ডার */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;position:relative}
.sum small{display:block;color:var(--muted);font-size:12px}
.sum b{font:700 18px var(--num)}
.sum .go{position:absolute;right:12px;top:10px;color:var(--muted)}
.sum .good{color:var(--good)}
.bal{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:0 16px}
.bal::-webkit-scrollbar{display:none}
.bal div{flex:0 0 auto;display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}.dot.low{background:var(--warn)}
.oc{display:grid;gap:8px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px}
.oc .meta{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.oc .acts{display:flex;gap:8px}
.why{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}
.oc .acts .btn{flex:1}

/* সারি (সার্ভিস, লগ) */
.rowc{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;width:100%;text-align:left}
.rowc.off{opacity:.62}
.sw{width:46px;height:28px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:#fff}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:30;width:54px;height:54px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 8px 20px rgb(79 70 229/.4)}
.fab[hidden]{display:none}
.menu-list{display:grid;gap:8px}
.grp{font:700 12px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 0}
.ic{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}

/* ড্রয়ার */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;max-height:88vh;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow);transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sheet-in{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0;flex:1}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 4px;flex:none}
.sh-h{display:flex;align-items:center;gap:10px;padding:6px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));flex:none}
.sh-h h2{margin:0;font-size:18px;flex:1}
.sh-b{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-left,0px)) 16px max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px;align-content:start}
.sh-f{padding:10px max(16px,env(safe-area-inset-left,0px)) 12px max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);display:flex;gap:8px;flex:none}
.sh-f .btn{flex:1}
.kv{display:grid;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kv div{display:flex;justify-content:space-between;gap:14px;padding:9px 12px;border-top:1px solid var(--line);font-size:14px}
.kv div:first-child{border-top:0}.kv span{color:var(--muted)}.kv b{text-align:right;overflow-wrap:anywhere}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:14px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit}
.field textarea{min-height:92px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.msg{max-width:86%;padding:9px 12px;border-radius:14px;font-size:14px;background:var(--surface-2)}
.msg.me{margin-left:auto;background:var(--accent);color:var(--on-accent)}
.msg small{display:block;opacity:.7;font-size:11px;margin-top:2px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);width:100%;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt[aria-pressed="true"] .radio{border:6px solid var(--accent)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:90;opacity:0;transition:.2s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.sheet,.scrim,.toast,.sw::after{transition:none}}
</style>

<div id="login" hidden style="position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:16px"><div class="card" style="width:100%;max-width:380px;display:grid;gap:12px"><h1 style="margin:0;font-size:21px">boostplus অ্যাডমিন</h1><div class="field"><label for="tokIn">অ্যাডমিন টোকেন</label><input id="tokIn" type="password" autocomplete="current-password"></div><div id="loginErr" class="muted sm" role="alert"></div><button class="btn wide" id="loginBtn">লগইন</button></div></div>
<div class="app">
  <header class="hdr">
    <h1 id="title">অর্ডার</h1>
    <button class="ib" id="btnRef" aria-label="রিফ্রেশ"><svg class="i"><use href="#i-refresh"/></svg></button>
    <button class="ib" id="btnTheme" aria-label="লাইট বা ডার্ক বদলান"><svg class="i"><use href="#i-moon"/></svg></button>
  </header>

  <main>

    <!-- অর্ডার -->
    <section class="screen" id="s-orders">
      <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="q" type="search" placeholder="অর্ডার আইডি, মোবাইল, TrxID" aria-label="অর্ডার খুঁজুন"></label>
      <button class="alert" id="alertBox" hidden></button>
      <div class="chips" id="stChips" role="group" aria-label="অবস্থা অনুযায়ী ফিল্টার"></div>
      <button class="sum" id="sumBtn" aria-label="আজকের হিসাবের বিস্তারিত">
        <svg class="i go"><use href="#i-chev"/></svg>
        <div><small>আজকের বিল</small><b class="num" id="sCust">—</b></div>
        <div><small>খরচ</small><b class="num" id="sCost">—</b></div>
        <div><small>লাভ</small><b class="good num" id="sProf">—</b></div>
      </button>
      <div class="bal" id="balBar" aria-label="প্রোভাইডার ব্যালেন্স"></div>
      <div class="list" id="orderList"></div>
    </section>

    <!-- ইনবক্স -->
    <section class="screen" id="s-inbox" hidden>
      <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="inq" type="search" placeholder="অর্ডার আইডি, মোবাইল, টিকিট নম্বর" aria-label="ইনবক্সে খুঁজুন"></label>
      <div class="seg" id="inKind"><button aria-pressed="true" data-k="all">সব</button><button aria-pressed="false" data-k="ticket">টিকিট</button><button aria-pressed="false" data-k="speed">Speed up</button><button aria-pressed="false" data-k="prov">প্রোভাইডার</button></div>
      <div class="seg" id="inState"><button aria-pressed="true" data-s="open">খোলা</button><button aria-pressed="false" data-s="done">শেষ</button></div>
      <div class="list" id="inList"></div>
    </section>

    <!-- সার্ভিস -->

</div>

  <button data-go="orders" aria-current="page"><svg class="i"><use href="#i-orders"/></svg>অর্ডার</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="sheet-in">
  <div class="grab"></div>
  <div class="sh-h"><h2 id="shT"></h2><button class="ib" id="shX" aria-label="বন্ধ করুন"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div class="sh-b" id="shB"></div>
  <div class="sh-f" id="shF" hidden></div>
</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
var API="https://script.google.com/macros/s/AKfycbxacUqhDDc_2kRsedBF_x8zTrqUhNloQryVEkKuJzDC7SAyh_po6BbxX2F0ZLrrPmhV/exec";
var TK="pb_admin_token",token="";try{token=localStorage.getItem(TK)||""}catch(e){}
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var ICON=function(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>'};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var tk=function(n){return '৳ '+(Math.round((Number(n)||0)*100)/100).toLocaleString('en-US')};
var tm=function(s){s=String(s||'');return s.length>16?s.slice(5,16):s};
var ST={Pending:['s-pen','Pending'],Processing:['s-pro','Processing'],Partial:['s-par','Partial'],Completed:['s-ok','Completed'],Rejected:['s-rej','Rejected']};
var TITLES={orders:'অর্ডার',inbox:'ইনবক্স',services:'সার্ভিস',money:'টাকা',more:'আরও'};
var orders=[],counts={},filt='Pending',inbox=[],inK='all',inS='open',pkgs=[],meta={prices:{},hidden:[]},plat='',mTab='wallet',cur='orders',lastFocus=null;

function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){e.classList.remove('on')},2400)}
function fail(e){toast((e&&e.message)||'নেটওয়ার্ক সমস্যা')}
function api(body){
  return fetch(API,{method:'POST',mode:'cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({token:token},body))})
  .then(function(r){return r.json()}).then(function(d){
    if(d&&d.error==='unauthorized'){logout('ভুল টোকেন, আবার লগইন করুন');throw new Error('ভুল টোকেন')}
    if(d&&d.error==='locked_out')throw new Error('প্যানেল সাময়িক লক, একটু পরে চেষ্টা করুন');
    return d||{}});
}
function sheet(title,body,foot){
  lastFocus=document.activeElement;$('#shT').textContent=title;$('#shB').innerHTML=body;
  var f=$('#shF');if(foot){f.innerHTML=foot;f.hidden=false}else{f.hidden=true;f.innerHTML=''}
  $('#sheet').classList.add('on');$('#scrim').classList.add('on');$('#shX').focus();
}
function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on');if(lastFocus&&lastFocus.focus)lastFocus.focus()}
$('#scrim').addEventListener('click',closeSheet);$('#shX').addEventListener('click',closeSheet);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-o],[data-a][role=button]')){e.preventDefault();e.target.click()}});
function empty(t,s){return '<div class="empty"><b>'+t+'</b>'+(s||'')+'</div>'}
function KV(rows){return '<div class="kv">'+rows.filter(function(r){return r[1]!==''&&r[1]!=null}).map(function(r){return '<div><span>'+r[0]+'</span><b>'+esc(r[1])+'</b></div>'}).join('')+'</div>'}

/* লগইন */
function logout(msg){token='';try{localStorage.removeItem(TK)}catch(e){}$('#login').hidden=false;$('#loginErr').textContent=msg||''}
$('#loginBtn').addEventListener('click',function(){
  var v=$('#tokIn').value.trim();if(!v)return;token=v;try{localStorage.setItem(TK,v)}catch(e){}
  $('#login').hidden=true;$('#tokIn').value='';boot();
});
$('#tokIn').addEventListener('keydown',function(e){if(e.key==='Enter')$('#loginBtn').click()});

/* নেভিগেশন */
function go(n){
  cur=n;$$('.screen').forEach(function(s){s.hidden=s.id!=='s-'+n});
  $$('#nav button').forEach(function(b){if(b.dataset.go===n)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  $('#title').textContent=TITLES[n];try{history.replaceState(null,'','#'+n)}catch(e){}window.scrollTo(0,0);
  if(n==='inbox')loadInbox();if(n==='services'&&!pkgs.length)loadServices();if(n==='money')renderMoney();
}
$('#nav').addEventListener('click',function(e){var b=e.target.closest('button');if(b)go(b.dataset.go)});
function refresh(){if(cur==='orders'){loadOrders();loadStats();loadBal();loadAlerts()}else if(cur==='inbox')loadInbox();else if(cur==='services')loadServices();else if(cur==='money')renderMoney()}
$('#btnRef').addEventListener('click',refresh);

/* অর্ডার */
function renderChips(){$('#stChips').innerHTML=Object.keys(ST).map(function(k){return '<button class="chip" aria-pressed="'+(filt===k)+'" data-f="'+k+'">'+ST[k][1]+' <b class="num">'+(counts[k]==null?'–':counts[k])+'</b></button>'}).join('')}
function failed(o){return /FAILED|not enough funds|Auto-forward error|place manually/i.test(String(o.note||''))||(o.status==='Processing'&&!o.provider_order_id&&!o.live_provider_status)}
function renderOrders(){
  var h=orders.map(function(o){
    var p=ST[o.status]||ST.Pending,acts='',why='';
    if(o.status==='Pending')acts='<span class="btn sm" data-a="ap" data-id="'+esc(o.order_id)+'" role="button" tabindex="0">Approve</span><span class="btn sm line" data-a="rj" data-id="'+esc(o.order_id)+'" role="button" tabindex="0">বাতিল ও রিফান্ড</span>';
    else if(o.status==='Processing'&&failed(o)){why=o.note||'প্রোভাইডারে যায়নি';acts='<span class="btn sm" data-a="rt" data-id="'+esc(o.order_id)+'" role="button" tabindex="0">আবার পাঠান</span><span class="btn sm line" data-a="rj" data-id="'+esc(o.order_id)+'" role="button" tabindex="0">বাতিল ও রিফান্ড</span>'}
    return '<div class="oc" data-o="'+esc(o.order_id)+'" tabindex="0" role="button"><div class="row"><span class="t num">'+esc(o.order_id)+'</span><span class="pill '+p[0]+'">'+p[1]+'</span><span class="sp"></span><span class="muted sm">'+esc(tm(o.created_at))+'</span></div><div class="ell">'+esc(o.service_name)+'</div><div class="meta"><span class="num">'+(Number(o.quantity)||0).toLocaleString('en-US')+' টি</span><span class="num">'+tk(o.amount)+'</span><span class="num">'+esc(o.whatsapp||o.mobile||'')+'</span></div>'+(why?'<div class="why">'+esc(why)+'</div>':'')+(acts?'<div class="acts">'+acts+'</div>':'')+'</div>';
  }).join('');
  $('#orderList').innerHTML=h||empty('কোনো অর্ডার নেই','অন্য অবস্থা বেছে নিন বা খোঁজা বদলান।');
}
var oSeq=0;
function loadOrders(){
  var q=($('#q').value||'').trim(),seq=++oSeq;
  if(!orders.length)$('#orderList').innerHTML=empty('লোড হচ্ছে…');
  api({action:'admin_list',status:q?'All':filt,live:false,q:q}).then(function(d){
    if(seq!==oSeq)return;
    if(d.ok===false||!Array.isArray(d.orders)){$('#orderList').innerHTML=empty('লোড হয়নি',esc(d.error||d.message||'আবার চেষ্টা করুন'));return}
    orders=d.orders;renderOrders();
  }).catch(function(e){if(seq===oSeq)$('#orderList').innerHTML=empty('লোড হয়নি',esc(e.message))});
}
function loadStats(){
  api({action:'admin_stats'}).then(function(d){
    if(!d.ok)return;counts=d.counts||{};renderChips();
    var t=d.today||{},a=d.all_time||{};window._st={t:t,a:a,d:d};
    $('#sCust').textContent=tk(t.customer);$('#sCost').textContent=tk(t.cost);$('#sProf').textContent=tk(t.profit);
  }).catch(function(){});
}
function loadBal(){
  api({action:'admin_balances'}).then(function(d){
    if(!d.ok)return;
    $('#balBar').innerHTML=(d.balances||[]).map(function(b){var v=b.ok?Number(b.balance):null;return '<div><i class="dot'+(v!=null&&v<5?' low':'')+'"></i>'+esc(b.provider)+' <b class="num">'+(v==null?'—':'$'+Math.round(v*100)/100)+'</b></div>'}).join('');
  }).catch(function(){});
}
$('#stChips').addEventListener('click',function(e){var b=e.target.closest('[data-f]');if(b){filt=b.dataset.f;renderChips();loadOrders()}});
var qT;$('#q').addEventListener('input',function(){clearTimeout(qT);qT=setTimeout(loadOrders,400)});
$('#sumBtn').addEventListener('click',function(){
  var s=window._st||{t:{},a:{},d:{}},t=s.t,a=s.a;
  sheet('হিসাব','<h3 class="grp" style="margin-top:0">আজ '+esc(t.date||'')+'</h3>'+KV([['অর্ডার',t.orders||0],['কাস্টমার বিল',tk(t.customer)],['প্রোভাইডার খরচ',tk(t.cost)],['লাভ',tk(t.profit)]])+'<h3 class="grp">শুরু থেকে'+(s.d.first_date?' ('+esc(s.d.first_date)+')':'')+'</h3>'+KV([['কাস্টমার বিল',tk(a.customer)],['প্রোভাইডার খরচ',tk(a.cost)],['লাভ',tk(a.profit)]])+'<p class="muted sm">Completed ধরে হিসাব। Pending ও Rejected ধরা হয়নি'+(t.cost_missing?'। '+t.cost_missing+'টি অর্ডারের খরচ পাওয়া যায়নি, লাভ ঠিক নাও হতে পারে':'')+'।</p>');
});
function orderSheet(id){
  var o=orders.filter(function(x){return x.order_id===id})[0];if(!o)return;var p=ST[o.status]||ST.Pending,foot='',i=esc(o.order_id);
  if(o.status==='Pending')foot='<button class="btn" data-a="ap" data-id="'+i+'">Approve</button><button class="btn bad" data-a="rj" data-id="'+i+'">বাতিল ও রিফান্ড</button>';
  else if(o.status==='Processing'||o.status==='Partial')foot=(failed(o)?'<button class="btn" data-a="rt" data-id="'+i+'">আবার পাঠান</button>':'')+(o.refill_allowed?'<button class="btn sec" data-a="rf" data-id="'+i+'">Refill</button>':'')+'<button class="btn sec" data-a="cp" data-id="'+i+'">Completed</button><button class="btn bad" data-a="rj" data-id="'+i+'">বাতিল</button>';
  sheet(o.order_id,'<div><span class="pill '+p[0]+'">'+p[1]+'</span></div>'+KV([['সার্ভিস',o.service_name],['কোড',o.service_code],['লিংক',o.link],['পরিমাণ',o.quantity],['টাকা',tk(o.amount)],['মোবাইল',o.whatsapp||o.mobile],['পেমেন্ট',o.paid_from],['TrxID',o.txn_id],['সময়',o.created_at],['প্রোভাইডার',(o.provider||'')+(o.provider_order_id?' #'+o.provider_order_id:'')],['প্রোভাইডার অবস্থা',o.live_provider_status],['বাকি',o.live_remains],['নোট',o.note]])+'',foot||null);
}
function upd(id,status,okMsg,cb){
  api({action:'admin_update',order_id:id,status:status}).then(function(d){
    if(!d.ok){toast(d.message||d.error||'হয়নি');return}
    if(cb)cb();closeSheet();toast(d.refunded?id+' বাতিল, ৳'+d.refunded+' ওয়ালেটে ফেরত':d.refund_error?'বাতিল হয়েছে, রিফান্ড ব্যর্থ: '+d.refund_error:okMsg);loadOrders();loadStats();
  }).catch(fail);
}
function act(a,id,b){if(ext(a,id,b))return;
  if(a==='ap'){if(confirm(id+' Approve করবেন?'))upd(id,'Processing',id+' Processing-এ গেছে');return}
  if(a==='rj'){if(confirm(id+' বাতিল করে টাকা ওয়ালেটে ফেরত দেবেন?'))upd(id,'Rejected','বাতিল হয়েছে');return}
  if(a==='cp'){if(confirm(id+' Completed করবেন?'))upd(id,'Completed','Completed হয়েছে');return}
  if(a==='rt'){if(!confirm(id+' আবার প্রোভাইডারে পাঠাবেন? (আগে ব্যালেন্স দেখে নিন)'))return;
    api({action:'admin_retry_forward',order_id:id}).then(function(d){closeSheet();toast(d.ok?'পাঠানো হয়েছে #'+(d.provider_order_id||''):d.error==='already_forwarded'?'আগেই পাঠানো হয়েছে':(d.message||d.error||'ব্যর্থ'));loadOrders()}).catch(fail);return}
  if(a==='rf'){api({action:'admin_refill',order_id:id}).then(function(d){closeSheet();toast(d.ok?'Refill পাঠানো হয়েছে':'Refill ব্যর্থ: '+(d.message||d.error||''))}).catch(fail);return}
  if(a==='tsend'){var t=$('#tkReply'),s=$('#tkStatus');b.disabled=true;
    api({action:'admin_ticket_reply',ticket_id:id,reply:t.value,status:s.value}).then(function(d){b.disabled=false;if(d.ok){closeSheet();toast('সেভ হয়েছে');loadInbox()}else toast(d.error||'সেভ হয়নি')}).catch(function(e){b.disabled=false;fail(e)});return}
  if(a==='pt'){var type=b.dataset.type||'Speed up',ids=b.dataset.ids||($('#ptIds')||{}).value||'';if(!ids.trim())return toast('অর্ডার আইডি দিন');
    b.disabled=true;toast('পাঠানো হচ্ছে… (৪০ সেকেন্ড পর্যন্ত লাগতে পারে)');
    api({action:'admin_provider_ticket',sub:'send',type:type,site_order_ids:ids}).then(function(d){b.disabled=false;if(d.ok){if(type==='Speed up'&&b.dataset.ids)api({action:'admin_speedup',sub:'done',order_id:ids}).catch(function(){});closeSheet();toast('পাঠানো হয়েছে'+(d.state?' · '+d.state:''));loadInbox()}else toast(d.message||d.error||'ব্যর্থ')}).catch(function(e){b.disabled=false;fail(e)});return}
  if(a==='adj'){var am=Number($('#am').value),rs=$('#rs').value.trim(),dir=Number(b.dataset.dir),mob=b.dataset.id;
    if(!am||am<=0)return toast('পরিমাণ দিন');if(!rs)return toast('কারণ লিখুন');if(!confirm((dir>0?'যোগ +':'কাটুন −')+am+' ৳ · '+mob))return;
    api({action:'admin_wallet',sub:'adjust',mobile:mob,delta:dir*am,type:$('#aty').value,reason:rs,ref:''}).then(function(d){if(d.ok){closeSheet();toast('নতুন ব্যালেন্স '+tk(d.balance))}else toast((d.error||d.message||'ব্যর্থ')+(d.balance!=null?' · ব্যালেন্স '+tk(d.balance):''))}).catch(fail);return}
  if(a==='pd'){api({action:'admin_wallet',sub:'pin_request_dismiss',mobile:id}).then(renderMoney).catch(fail);return}
  if(a==='sp'){var v=Number($('#cp').value);if(!(v>0))return toast('সঠিক দাম দিন');api({action:'admin_service_meta',sub:'set_price',code:id,price:v}).then(function(d){if(d.ok){meta.prices[id]=v;closeSheet();renderSvc();toast('দাম সংরক্ষণ হয়েছে')}else toast(d.error||'ব্যর্থ')}).catch(fail);return}
  if(a==='rp'){api({action:'admin_service_meta',sub:'remove_price',code:id}).then(function(d){if(d.ok){delete meta.prices[id];closeSheet();renderSvc();toast('ডিফল্ট দামে ফেরানো হয়েছে')}else toast(d.error||'ব্যর্থ')}).catch(fail);return}
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(b){e.stopPropagation();act(b.dataset.a,b.dataset.id,b);return}
  var oc=e.target.closest('[data-o]');if(oc)orderSheet(oc.dataset.o);
});

/* ইনবক্স */
function loadInbox(){
  Promise.allSettled([api({action:'admin_ticket_list',status:'All'}),api({action:'admin_speedup',sub:'list'}),api({action:'admin_provider_ticket',sub:'list'})]).then(function(R){
    var ok=function(r){return r.status==='fulfilled'&&r.value&&r.value.ok!==false},items=[];
    if(ok(R[0]))(R[0].value.tickets||[]).forEach(function(t){var o=!/^(resolved|closed)$/i.test(t.status||'Open');items.push({k:'ticket',s:o?'open':'done',id:t.ticket_id,t:(t.category||'টিকিট')+(t.subcategory?' / '+t.subcategory:''),m:t.mobile||'',time:t.created_at||'',raw:t,ts:Date.parse(String(t.created_at||'').replace(' ','T'))||0})});
    if(ok(R[1]))(R[1].value.requests||[]).forEach(function(r){items.push({k:'speed',s:'open',id:r.order_id,t:'Speed up অনুরোধ · '+(r.provider||''),m:'অর্ডার '+r.order_id,time:'',raw:r,ts:Number(r.requested_ms)||0})});
    if(ok(R[2])){(R[2].value.requests||[]).filter(function(r){return r.state==='needs_manual'}).forEach(function(r){items.push({k:'prov',s:'open',id:r.type,t:r.type+' — হাতে পাঠান',m:'প্রোভাইডার অর্ডার: '+r.provider_orders,time:r.time||'',raw:r,ts:Date.parse(String(r.time||'').replace(' ','T'))||0})});
      (R[2].value.queue||[]).filter(function(r){return r.state==='failed'}).forEach(function(r){items.push({k:'prov',s:'open',id:r.type,t:r.type+' — স্বয়ংক্রিয় পাঠানো ব্যর্থ',m:'সাইট অর্ডার '+r.site_order+' · '+(r.provider||''),time:r.time||'',raw:r,ts:Date.parse(String(r.time||'').replace(' ','T'))||0})})}
    inbox=items.sort(function(a,b){return b.ts-a.ts});var n=inbox.filter(function(x){return x.s==='open'}).length,bd=$('#inBadge');bd.textContent=n;bd.hidden=!n;renderInbox();
  });
}
function renderInbox(){

    if(d.ok===false||d.error)return toast('ফেল: '+(d.error||''));
    var R=(d.refunds||[]).map(function(r){return '<div><span>'+esc(tm(r.created_at))+' · '+esc(r.ref||'')+(r.service_name?' · '+esc(r.service_name):'')+'<br><small>'+esc(r.reason||'')+'</small></span><b class="num" style="color:var(--good)">+৳'+esc(r.amount)+'</b></div>'}).join('');
    sheet(m,KV([['ব্যালেন্স',d.balance==null?'—':tk(d.balance)],['মোট রিফান্ড',tk(d.refund_total)],['রিফান্ড সংখ্যা',(d.refunds||[]).length],['অর্ডার সংখ্যা',d.order_count||0],['রিফান্ড বাকি',d.refund_pending_count||'']])+(Number(d.refund_pending_count)?'<div class="warnbox">'+d.refund_pending_count+'টি Rejected অর্ডারের টাকা এখনো ফেরত যায়নি।</div>':'')+'<h3 class="grp">রিফান্ড</h3>'+(R?'<div class="kv">'+R+'</div>':empty('কোনো রিফান্ড নেই')));
  }).catch(fail);
});
function ext(a,id,b){
  if(a==='ad'){api({action:'admin_alerts',sub:'clear',id:id}).then(function(){closeSheet();loadAlerts()}).catch(fail);return 1}
  if(a==='adall'){if(confirm('সব অ্যালার্ট মুছবেন?'))api({action:'admin_alerts',sub:'clear_all'}).then(function(){closeSheet();loadAlerts()}).catch(fail);return 1}
  if(a==='spper'){SP.per=id;drawSpeed(false);return 1}
  if(a==='thpick'){$$('#shB .opt').forEach(function(x){x.setAttribute('aria-pressed',x===b)});return 1}
  if(a==='thsave'){var s=$('#shB .opt[aria-pressed="true"]');if(!s)return 1;api({action:'admin_theme_save',mode:s.dataset.id}).then(function(d){if(d.ok){closeSheet();toast('থিম সংরক্ষণ হয়েছে')}else toast(d.error||'সেভ হয়নি')}).catch(fail);return 1}
}

function boot(){renderChips();loadOrders();loadStats();loadBal();loadAlerts();loadInbox();var h=(location.hash||'').replace('#','');go(TITLES[h]?h:'orders')}
renderMore();
if(token){$('#login').hidden=true;boot()}else{$('#login').hidden=false}
setInterval(function(){if(token&&!document.hidden&&cur==='orders'&&!$('#sheet').classList.contains('on')){loadOrders();loadStats()}},60000);
})();
</script>
