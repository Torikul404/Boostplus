<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>boostplus সার্ভিস স্টুডিও</title><meta name="theme-color" content="#4F46E5"><meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/admin-192.png"><link rel="apple-touch-icon" href="icons/admin-192.png"><meta name="application-name" content="স্টুডিও"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="স্টুডিও"><link rel="stylesheet" href="app.css"></head>
<body><a class="skip" href="#main">মূল অংশে যান</a>
<section id="login" hidden><form id="loginForm" class="card login"><h1>সার্ভিস স্টুডিও</h1><label for="tok">অ্যাডমিন টোকেন</label><input id="tok" type="password" autocomplete="current-password" required><p id="loginErr" class="err" role="alert" aria-live="polite"></p><button class="btn" type="submit">প্রবেশ করুন</button></form></section>
<div id="app" hidden>
<header id="top"><div style="display:flex;align-items:center;gap:8px"><button id="back" class="ib" aria-label="পেছনে" hidden>‹</button><h2 id="title">সার্ভিস স্টুডিও</h2></div>
<div class="tools"><button id="install" class="ib" title="অ্যাপ ইনস্টল" aria-label="অ্যাপ ইনস্টল">⤓</button><button id="logout" class="ib" aria-label="বের হন" title="বের হন">⎋</button></div></header>
<p id="net" class="banner" hidden role="status">ইন্টারনেট নেই</p><main id="main" tabindex="-1"></main></div>
<dialog id="sheet" aria-labelledby="shT"><form method="dialog" id="shForm"><h3 id="shT" style="margin:0 0 8px">সাইটে চালু করুন</h3><p id="shN" class="sub"></p>
<label for="shName">সাইটে নাম</label><input id="shName" maxlength="120">
<label for="shPlat">প্ল্যাটফর্ম</label><select id="shPlat"></select>
<label for="shCat">ক্যাটেগরি</label><input id="shCat" required autocomplete="off"><div id="shSg" class="csg"></div>
<div id="shPriceBdt"><label for="shBdt">বিক্রয় দাম (৳ প্রতি ১০০০)</label><input id="shBdt" type="number" step="0.01" min="0"></div>
<div id="shPriceUsd"><label for="shUsd">বিক্রয় দাম (USD প্রতি ১০০০)</label><input id="shUsd" type="number" step="0.0001" min="0"></div>
<p id="shInfo" class="sub"></p><p id="shErr" class="err" role="alert"></p>
<div class="acts"><button class="sm" value="cancel" formnovalidate>বাতিল</button><button class="btn" id="shOk" value="ok">চালু করুন</button></div></form></dialog>
<script src="app.js"></script></body></html>
